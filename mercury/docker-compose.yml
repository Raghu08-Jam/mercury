services:
    db:
      image: postgres:16
      environment:
        POSTGRES_DB: mercury
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      ports:
        - "5432:5432"
      volumes:
        - mercury-db-data:/var/lib/postgresql/data
    app:
      build: .
      ports:
        - "8080:8080"
      depends_on:
        - db
        - redis
      environment:
        SPRING_PROFILES_ACTIVE: docker
        JWT_SECRET: ${JWT_SECRET}
        DB_PASSWORD: ${DB_PASSWORD}
    redis:
      image: redis:7
      ports:
        - "6379:6379"
volumes:
  mercury-db-data: