services:
    db:
      image: postgres:16
      environment:
        POSTGRES_DB: mercury
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: "Raghu@0806"
      ports:
        - "5432:5432"
      volumes:
        - mercury-db-data:/var/lib/postgresql/data
    app:
      build: .
      ports:
        - "8080:8080"
      depends_on:
        - db
      environment:
        SPRING_PROFILES_ACTIVE: docker
volumes:
  mercury-db-data: